packages:
  - apps/*
  - apps/*/web
  - packages/*
  - packages/*/example
allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
  dtrace-provider: true
  '@fails-components/webtransport-transport-http3-quiche': true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.2'
  - '@astrojs/markdown-remark@7.3.7'
  - '@astrojs/markdown-satteri@0.4.8'
  - '@astrojs/runtime@0.1.0'
  - '@astrojs/vite-plugin-astro@0.1.1'
  - astro@7.4.10
  - miniflare@5.20261110.0-beta
  - wrangler@4.160.0
patchedDependencies:
  '@ark/schema': patches/@ark__schema.patch
  '@react-native-masked-view/masked-view': patches/@react-native-masked-view__masked-view.patch
  expo-updates@58.0.21: patches/expo-updates@58.0.21.patch
  metro-runtime@0.87.1: patches/metro-runtime@0.87.1.patch
  metro@0.87.1: patches/metro@0.87.1.patch
  number-flow-react-native@0.5.1: patches/number-flow-react-native@0.5.1.patch
  react-native-gesture-handler@3.5.0: patches/react-native-gesture-handler@3.5.0.patch
  react-native-pager-view@10.0.0: patches/react-native-pager-view@10.0.0.patch
  react-native-paper@5.15.4: patches/react-native-paper@5.15.4.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
  rn-newarch-svga-player@1.1.16: patches/rn-newarch-svga-player@1.1.16.patch
