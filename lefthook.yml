pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: sh scripts/git-hooks.sh gitleaks
    format-codes:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,yml,yaml,toml}'
      run: sh scripts/git-hooks.sh format {staged_files}
      stage_fixed: true
    lint-codes:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}'
      run: sh scripts/git-hooks.sh lint {staged_files}
      stage_fixed: true
    format-plain-text:
      glob: '*.{md,mdx}'
      run: sh scripts/git-hooks.sh format {staged_files}
      stage_fixed: true
