pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: |
        if command -v gitleaks > /dev/null 2>&1; then
          gitleaks protect --staged --verbose $([ -f .gitleaks-baseline.json ] && echo "--baseline-path .gitleaks-baseline.json")
        else
          echo "⚠️ gitleaks is not installed, skipping secret scan. Install with: brew install gitleaks"
        fi
    format-codes:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,yml,yaml,toml}'
      run: |
        set -f
        set -- {staged_files}

        if [ "$#" -eq 0 ]; then
          echo "No staged files to format."
          exit 0
        fi

        pnpm oxfmt --write --no-error-on-unmatched-pattern "$@"
      stage_fixed: true
    lint-codes:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx}'
      run: |
        set -f
        set -- {staged_files}

        if [ "$#" -eq 0 ]; then
          echo "No staged code files to lint."
          exit 0
        fi

        pnpm oxlint --type-aware --no-error-on-unmatched-pattern "$@"
      stage_fixed: true
    format-plain-text:
      glob: '*.{md,mdx}'
      run: |
        set -f
        set -- {staged_files}

        if [ "$#" -eq 0 ]; then
          exit 0
        fi

        pnpm oxfmt --write --no-error-on-unmatched-pattern "$@"
      stage_fixed: true
