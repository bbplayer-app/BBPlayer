name: Compute Hot Update Fingerprint
on: workflow_dispatch
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🛠 Setup mise task runner
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.15
          install: false
          cache: false
          env: false
          export_path: false
          add_shims_to_path: false

      - uses: pnpm/setup@v2
        with:
          # version: 11 -- use packageManager in package.json
          runtime: node@26
          cache: true
          install: true

      - name: 🔍 Compute update fingerprint
        env:
          BBPLAYER_UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          BBPLAYER_UPDATE_SERVER_TOKEN: ${{ secrets.UPDATE_SERVER_TOKEN }}
        run: |
          mise run --skip-tools --quiet ota:fingerprint --json | jq
