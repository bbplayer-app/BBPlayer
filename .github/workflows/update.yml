name: Hot Update
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🤖 Setup PNPM
        uses: pnpm/action-setup@v4

      - name: 🏗 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: 🏗 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Export and publish update
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_SERVER_TOKEN: ${{ secrets.UPDATE_SERVER_TOKEN }}
        run: |
          cd apps/mobile
          npx expo export --clear --platform android --output-dir dist
          npx expo config --type public --json > dist/expoConfig.json
          runtime_version="$(npx --yes eas-cli@latest fingerprint:generate --platform android --json --non-interactive | jq -r '.hash')"
          test -n "$runtime_version"
          cd ../..
          go -C apps/update-server run ./cmd/bbplayer-updates publish \
            --server "$UPDATE_SERVER_URL" \
            --token "$UPDATE_SERVER_TOKEN" \
            --channel production \
            --dist ../mobile/dist \
            --runtime-version "$runtime_version" \
            --message "$(git log -1 --format=%s)"

      - name: 🚀 Submit source map
        run: cd apps/mobile && SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} npx sentry-expo-upload-sourcemaps dist
