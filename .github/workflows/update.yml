name: Hot Update
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: roitium
      SENTRY_PROJECT: bbplayer
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          # version: 11 -- use packageManager in package.json
          runtime: node@26
          cache: true
          install: true

      - name: ⚙️ Prepare Variables
        run: |
          # runtimeVersion 用 appVersion 策略，热更新只会下发给同一版本号的原生包
          APP_VERSION=$(node -p "require('./apps/mobile/package.json').version")
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          # Sentry release 固定跟原生包走，热更新用 app.ota.commit 属性区分
          echo "OTA_COMMIT=${SHORT_SHA}" >> $GITHUB_ENV
          echo "OTA_TAG=ota-v${APP_VERSION}-${SHORT_SHA}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "UPDATE_MESSAGE=$(git log -1 --format=%s)" >> $GITHUB_ENV

      # appVersion 策略下发布时不会比对 fingerprint，热更新会下发给同版本号的所有原生包。
      # 这里确认 HEAD 的 Android 原生 fingerprint 和 v${APP_VERSION} 原生包一致，
      # 否则依赖新原生代码的 JS 会跑在旧原生包上
      - name: 🔍 Check native fingerprint against v${{ env.APP_VERSION }}
        env:
          # app.config 默认用 git commit 数当 versionCode，每个 commit 都不同，
          # 两边固定成同一个值，避免 expoConfig 因此对不上
          VERSION_CODE: 1
        run: |
          BASELINE_REF="v${APP_VERSION}"
          BASELINE_DIR="$RUNNER_TEMP/baseline"
          # 两边都用 HEAD 装的 @expo/fingerprint。直接调 bin：pnpm exec 发现依赖不同步时
          # 会先自动 install，并把日志打到 stdout 里
          FINGERPRINT="$PWD/apps/hot-update-cli/node_modules/.bin/fingerprint"
          generate() {
            "$FINGERPRINT" fingerprint:generate --platform android "$1"
          }

          if ! git rev-parse -q --verify "${BASELINE_REF}^{commit}" > /dev/null; then
            echo "::error::找不到原生包 tag ${BASELINE_REF}，版本 ${APP_VERSION} 可能还没发布原生包"
            exit 1
          fi

          git worktree add --detach "$BASELINE_DIR" "$BASELINE_REF"
          # autolinking 的结果取决于 node_modules，基线要按它自己的 lockfile 装一遍；
          # 生命周期脚本不影响 fingerprint，跳过
          (cd "$BASELINE_DIR" && pnpm install --frozen-lockfile --ignore-scripts)

          generate "$BASELINE_DIR/apps/mobile" > "$RUNNER_TEMP/fingerprint-baseline.json"
          generate "$PWD/apps/mobile" > "$RUNNER_TEMP/fingerprint-head.json"

          BASELINE_HASH=$(jq -r .hash "$RUNNER_TEMP/fingerprint-baseline.json")
          HEAD_HASH=$(jq -r .hash "$RUNNER_TEMP/fingerprint-head.json")
          echo "${BASELINE_REF} fingerprint: ${BASELINE_HASH}"
          echo "HEAD fingerprint: ${HEAD_HASH}"

          if [ "$BASELINE_HASH" = "$HEAD_HASH" ]; then
            echo "原生 fingerprint 一致，可以发布热更新"
            exit 0
          fi

          echo "::error::HEAD 的原生 fingerprint 与 ${BASELINE_REF} 不一致，包含原生改动，不能通过热更新发布"
          "$FINGERPRINT" fingerprint:diff \
            "$RUNNER_TEMP/fingerprint-baseline.json" "$RUNNER_TEMP/fingerprint-head.json" \
            | jq -r '.[] | (.addedSource // .removedSource // .afterSource) as $s
                | "\(.op)\t\($s.type)\t\($s.filePath // $s.id)"'
          exit 1

      - name: 🚀 Export and publish update
        env:
          BBPLAYER_UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          BBPLAYER_UPDATE_SERVER_TOKEN: ${{ secrets.UPDATE_SERVER_TOKEN }}
          # expo export 会把 EXPO_PUBLIC_* 内联进 JS bundle，热更新包也必须带上
          # DSN，否则热更新后的应用会静默停止上报。
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_OTA_COMMIT: ${{ env.OTA_COMMIT }}
        run: |
          cd apps/mobile
          pnpm hot-update publish \
            --non-interactive \
            --channel production \
            --message "$UPDATE_MESSAGE"

      - name: 🚀 Submit source map
        run: cd apps/mobile && npx sentry-expo-upload-sourcemaps dist

      # 以下两步只做记录，失败不影响已经发布的热更新
      - name: 🔗 Associate commits with Sentry release
        continue-on-error: true
        run: |
          # Sentry release 固定跟原生包走（见 apps/mobile/src/lib/config/sentry.ts），热更新不再单独建 release。
          # 对同一版本号的原生 release 重新 set-commits，commit 范围延到这次热更新的 HEAD，
          # suspect commits 和 release 页面的 commit 列表才能覆盖热更新带来的改动。
          # 不能用 npx：装完依赖后 npm 会把 pnpm 布局里的 @sentry/cli 当成已安装，
          # 跳过下载，但根目录 .bin 里并没有 sentry-cli，结果报 command not found
          RELEASES=$(pnpm dlx @sentry/cli releases list --raw \
            | grep -E "^com\.roitium\.bbplayer@${APP_VERSION//./\\.}\+[0-9]+$" || true)
          if [ -z "$RELEASES" ]; then
            echo "No native Sentry release found for ${APP_VERSION}, skipping"
            exit 0
          fi
          # 显式给出「上一个原生版本 tag → HEAD」的范围。--auto 会拿最近一个有 commit 的 release
          # 当起点，碰到旧的 +ota.* release 时范围只剩一两个 commit，还会覆盖掉原生构建时关联的 commit
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "v${APP_VERSION}^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+$(git rev-parse "$PREV_TAG")..}$(git rev-parse HEAD)"
          for RELEASE in $RELEASES; do
            echo "Sentry release: $RELEASE ($PREV_TAG..HEAD)"
            pnpm dlx @sentry/cli releases set-commits "$RELEASE" --commit "bbplayer-app/BBPlayer@${RANGE}"
          done

      - name: 🎁 Create GitHub release
        continue-on-error: true
        run: |
          if gh release view "$OTA_TAG" > /dev/null 2>&1; then
            echo "GitHub release $OTA_TAG already exists, skipping"
            exit 0
          fi

          # 标记为 prerelease 且不设为 latest，不影响原生包的 release 与下载页
          gh release create "$OTA_TAG" \
            --target "$GITHUB_SHA" \
            --title "Hot update v${APP_VERSION} (${GITHUB_SHA::7})" \
            --prerelease \
            --latest=false \
            --notes "$(printf '%s\n\n- Channel: production\n- Runtime version: %s\n- Commit: %s\n- Sentry: `app.ota.commit:%s`' \
              "$UPDATE_MESSAGE" "$APP_VERSION" "$GITHUB_SHA" "$OTA_COMMIT")"
