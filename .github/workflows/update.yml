name: Hot Update
on: workflow_dispatch
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: 🏗 Setup repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🚀 Export and publish update
        env:
          BBPLAYER_UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          BBPLAYER_UPDATE_SERVER_TOKEN: ${{ secrets.UPDATE_SERVER_TOKEN }}
        run: |
          cd apps/mobile
          pnpm hot-update -- publish \
            --non-interactive \
            --channel production \
            --message "$(git log -1 --format=%s)"

      - name: 🚀 Submit source map
        run: cd apps/mobile && SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }} npx sentry-expo-upload-sourcemaps dist
