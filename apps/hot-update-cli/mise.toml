[tasks."default"]
description = "Open the OTA menu or forward a CLI operation and its arguments"
raw = true
raw_args = true
run = "pnpm exec tsx src/index.ts --project-dir \"{{config_root}}/../mobile\""
alias = ["ota", "mobile:hot-update"]

[tasks."default".env]
_.file = { "path" = "{{config_root}}/../mobile/.env.local" }

[tasks."publish"]
description = "Run the OTA publish operation"
raw = true
raw_args = true
run = "pnpm exec tsx src/index.ts --project-dir \"{{config_root}}/../mobile\" publish"
alias = "ota:publish"

[tasks."publish".env]
_.file = { "path" = "{{config_root}}/../mobile/.env.local", "redact" = true }

