services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: updates
      POSTGRES_USER: updates
      POSTGRES_PASSWORD: updates-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updates -d updates"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:55432:5432"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports: ["127.0.0.1:59000:9000"]
  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/updates && mc anonymous set download local/updates"]
