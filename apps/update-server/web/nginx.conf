server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# The WebUI and the update server share one origin: pages are served here,
	# while /admin and the public Expo protocol are proxied to the API
	# container. Proxied routes are pinned with ^~ so asset patterns below
	# can never shadow them.

	# Expo export archives are intentionally uploaded as one multipart request.
	# Keep the larger limit narrowly scoped to the authenticated upload endpoint;
	# all other routes retain nginx's small default request-body limit.
	location = /admin/publish {
		client_max_body_size 256m;
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /admin/ {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ^~ /api/ {
		proxy_pass http://api:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location = /health {
		proxy_pass http://api:8080/health;
	}

	location = /icon.png {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# Vite emits content-hashed bundles under /assets and keeps every entry
	# HTML in place (index.html plus channels|updates|runtimes/ sub-folders).
	# Entry HTML must never be cached; the admin UI changes with each build.
	location ~* \.html$ {
		add_header Cache-Control "no-cache";
	}

	location / {
		try_files $uri $uri/index.html =404;
	}
}
