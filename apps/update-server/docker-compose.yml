# Local development stack. Services reach each other over the `internal`
# network (internal: true — no outside connectivity, no host exposure).
# `update-server-web` additionally joins the ordinary `default` network purely
# so compose can publish its host port; on an internal-only network Docker
# refuses port publishing. In production, add docker-compose.prod.yml and let
# an external reverse proxy reach `update-server-web` through the shared
# `proxy` network instead.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: updates
      POSTGRES_USER: updates
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      # Host path is configurable; default is ./data/postgres next to this file.
      - ${POSTGRES_DATA_PATH:-./data/postgres}:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U updates -d updates"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    image: ${UPDATE_SERVER_IMAGE:-bbplayer-updates:latest}
    command: ["migrate"]
    environment: &server-env
      DATABASE_URL: postgres://updates:${POSTGRES_PASSWORD}@postgres:5432/updates?sslmode=disable
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      INSTALLATION_HMAC_KEY: ${INSTALLATION_HMAC_KEY}
      CODE_SIGNING_PRIVATE_KEY: ${CODE_SIGNING_PRIVATE_KEY:-}
      CODE_SIGNING_KEY_ID: ${CODE_SIGNING_KEY_ID:-}
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    image: ${UPDATE_SERVER_IMAGE:-bbplayer-updates:latest}
    command: ["api"]
    environment: *server-env
    # Internal serves PostgreSQL and nginx; egress is required for R2's public
    # S3 endpoint. Neither network publishes an API port.
    networks: [internal, egress]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    image: ${UPDATE_SERVER_IMAGE:-bbplayer-updates:latest}
    command: ["worker"]
    environment: *server-env
    # The patch worker reads and writes complete bundles and patches in R2.
    networks: [internal, egress]
    depends_on: { migrate: { condition: service_completed_successfully } }
  update-server-web:
    image: ${UPDATE_SERVER_WEB_IMAGE:-bbplayer-updates-web:dev}
    networks: [internal, default]
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
networks:
  internal:
    internal: true
  # Normal Docker bridge network used only for outbound R2 S3 traffic. API and
  # worker remain unreachable from the host because they declare no ports.
  egress: {}
